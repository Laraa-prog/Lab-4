<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title> Mystery Door Game</title>

</head>


<body>

    <h1>Mystery Door Game</h1>
    <p>Choose one door to discover what is behind it.</p>

    <button id="red-door">Red Door</button>
    <button id="blue-door">Blue Door</button>
    <button id="green-door">Green Door</button>

    <h2>What will you do?</h2>

    <button id="enter-button">Enter through the Door</button>
    <button id="run-button">Run Away</button>

    <h2>Your Result</h2>
    <p id="result">Your mystery result will appear here.</p>

    <script src="js/script.js"></script>
</body>

</html>
